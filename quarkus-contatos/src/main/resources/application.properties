# --- HTTP ---
quarkus.http.port=8081

# --- Banco de dados (H2 em memória; definir a URL desliga o Dev Services) ---
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:contatos;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
quarkus.datasource.username=sa
quarkus.datasource.password=

# --- Hibernate ORM ---
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false

# --- OpenAPI / Swagger UI ---
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# --- Dados de exemplo no start (desabilite com app.seed.enabled=false) ---
app.seed.enabled=true

# --- Logs ---
quarkus.log.level=INFO
quarkus.log.category."com.example.contatos".level=DEBUG
